<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — McRae Social</title>
  <meta name="description" content="Contact Mr. McRae with questions about Social Studies assignments and curriculum.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header header--blue">
      <div class="header-icon">📧</div>
      <h1>Contact</h1>
      <p>Have a question? Send me a message below.</p>
    </header>

    <div class="contact-wrapper">
      <form action="https://formspree.io/f/placeholder_form_id" method="POST">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
        </div>
        
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="_replyto" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="course">Course</label>
          <select id="course" name="course" class="form-control" required style="background-color: rgba(0,0,0,0.8);">
            <option value="" disabled selected>Select a course</option>
            <option value="Social 9">Social 9</option>
            <option value="Social 10">Social 10</option>
            <option value="Social 20">Social 20</option>
            <option value="Social 30">Social 30</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" class="form-control" placeholder="How can I help you?" required></textarea>
        </div>
        
        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>

    <footer class="site-footer">
      <p>&copy; 2026 McRae Social. High School Social Studies.</p>
    </footer>
  </div>
  
  <script src="/js/nav.js"></script>
</body>
</html>
