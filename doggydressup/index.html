<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doggy Dress Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100vh;
        }
        html {
            background: url('/doggydressup/assets/comingsoon.png') center center / cover no-repeat;
            background-attachment: fixed;
        }
        /* Coming soon text */
        .coming-soon {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #e05c94, 5px 5px 12px rgba(0,0,0,0.4);
            white-space: nowrap;
            animation: bounce 1.8s ease-in-out infinite;
            z-index: 10;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%       { transform: translateX(-50%) translateY(-10px); }
        }
        /* Ro-dog blended in */
        .ro-dog {
            position: fixed;
            bottom: -10px;
            right: 4vw;
            height: 72vh;
            max-height: 580px;
            object-fit: contain;
            mix-blend-mode: multiply;
            -webkit-mask-image: radial-gradient(ellipse 78% 88% at 50% 55%, black 38%, transparent 82%);
            mask-image:         radial-gradient(ellipse 78% 88% at 50% 55%, black 38%, transparent 82%);
            filter: contrast(1.05) saturate(1.15);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="coming-soon">🐾 Coming Soon!</div>
    <img src="/doggydressup/assets/dogs/ro-dog.jpg" alt="Ro the dog" class="ro-dog">
</body>
</html>
