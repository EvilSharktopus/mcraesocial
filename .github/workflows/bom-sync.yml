name: Daily Box Office Sync

on:
  schedule:
    - cron: '0 15 * * *'   # 9am MDT (UTC-6) every day
  workflow_dispatch:        # also allows manual "Run workflow" from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Fetch movies & sync BOM via Apify
        uses: actions/github-script@v7
        with:
          script: |
            const FIREBASE_KEY = '${{ secrets.MOVIES_FIREBASE_KEY }}';
            const APIFY_TOKEN  = '${{ secrets.APIFY_TOKEN }}';
            const PROJECT_ID   = 'movies-1999c';

            // ── 1. Read movies from Firestore ────────────────────────────────
            const r    = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/movies?key=${FIREBASE_KEY}&pageSize=100`);
            const data = await r.json();
            const docs = data.documents || [];

            const movies = docs.map(doc => {
              const f = doc.fields || {};
              return {
                id:          doc.name.split('/').pop(),
                title:       f.title?.stringValue       || '',
                releaseDate: f.releaseDate?.stringValue || '',
              };
            }).filter(m => m.title);

            const movieList = movies.map(m => {
              const year = m.releaseDate?.slice(0, 4) || '';
              return year ? `${m.title} ${year}` : m.title;
            });

            console.log(`Syncing ${movieList.length} movies: ${movieList.join(', ')}`);

            // ── 2. Start Apify run asynchronously ────────────────────────────
            const startRes = await fetch(
              `https://api.apify.com/v2/acts/trovevault~movie-box-office-tracker/runs?token=${APIFY_TOKEN}`,
              {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ movies: movieList }),
              }
            );
            if (!startRes.ok) {
              const txt = await startRes.text();
              core.setFailed(`Apify start failed ${startRes.status}: ${txt}`);
              return;
            }
            const startData = await startRes.json();
            const runId = startData.data?.id;
            if (!runId) {
              core.setFailed(`Apify did not return a run ID: ${JSON.stringify(startData)}`);
              return;
            }
            console.log(`Apify run started: ${runId}`);

            // ── 3. Poll until SUCCEEDED (up to 5 min) ────────────────────────
            const MAX_WAIT_MS  = 5 * 60 * 1000;
            const POLL_MS      = 10_000;
            const deadline     = Date.now() + MAX_WAIT_MS;
            let status         = 'RUNNING';

            while (Date.now() < deadline) {
              await new Promise(r => setTimeout(r, POLL_MS));
              const statusRes = await fetch(
                `https://api.apify.com/v2/actor-runs/${runId}?token=${APIFY_TOKEN}`
              );
              const statusData = await statusRes.json();
              status = statusData.data?.status || 'UNKNOWN';
              console.log(`  run status: ${status}`);
              if (status === 'SUCCEEDED') break;
              if (['FAILED', 'ABORTED', 'TIMED-OUT'].includes(status)) {
                core.setFailed(`Apify run ended with status: ${status}`);
                return;
              }
            }

            if (status !== 'SUCCEEDED') {
              core.setFailed(`Apify run did not complete within 5 minutes (last status: ${status})`);
              return;
            }

            // ── 4. Fetch dataset items ────────────────────────────────────────
            const datasetRes = await fetch(
              `https://api.apify.com/v2/actor-runs/${runId}/dataset/items?token=${APIFY_TOKEN}&format=json`
            );
            if (!datasetRes.ok) {
              core.setFailed(`Failed to fetch dataset: ${datasetRes.status}`);
              return;
            }
            const results = await datasetRes.json();
            console.log(`Apify returned ${results.length} rows`);

            // ── 5. Patch domesticGross in Firestore ───────────────────────────
            let updated = 0;
            for (const row of results) {
              if (!row.domesticGross) continue;
              const gross = typeof row.domesticGross === 'number'
                ? row.domesticGross
                : parseInt(String(row.domesticGross).replace(/[^0-9]/g, ''));
              if (!gross || gross <= 0) continue;

              const rowTitle = (row.title || '').toLowerCase();
              const match = movies.find(m => {
                const t = m.title.toLowerCase();
                return t === rowTitle || t.includes(rowTitle) || rowTitle.includes(t);
              });
              if (!match) { console.warn(`No Firestore match for BOM title: "${row.title}"`); continue; }

              const patchUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/movies/${match.id}?updateMask.fieldPaths=domesticGross&key=${FIREBASE_KEY}`;
              await fetch(patchUrl, {
                method:  'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ fields: { domesticGross: { integerValue: String(gross) } } }),
              });
              updated++;
              console.log(`✓ ${match.title}: $${gross.toLocaleString()}`);
            }

            console.log(`\nDone — updated ${updated} / ${movies.length} movies.`);
