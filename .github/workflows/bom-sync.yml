name: Daily Box Office Sync

on:
  schedule:
    - cron: '0 18 * * *'   # noon MDT (UTC-6) every day
  workflow_dispatch:        # also allows manual "Run workflow" from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch movies & sync BOM via Apify
        uses: actions/github-script@v7
        with:
          script: |
            const FIREBASE_KEY = '${{ secrets.MOVIES_FIREBASE_KEY }}';
            const APIFY_TOKEN  = '${{ secrets.APIFY_TOKEN }}';
            const PROJECT_ID   = 'movies-1999c';

            // ── 1. Read movies from Firestore ────────────────────────────────
            const r    = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/movies?key=${FIREBASE_KEY}&pageSize=100`);
            const data = await r.json();
            const docs = data.documents || [];

            const movies = docs.map(doc => {
              const f = doc.fields || {};
              return {
                id:          doc.name.split('/').pop(),
                title:       f.title?.stringValue       || '',
                releaseDate: f.releaseDate?.stringValue || '',
              };
            }).filter(m => m.title);

            const movieList = movies.map(m => {
              const year = m.releaseDate?.slice(0, 4) || '';
              return year ? `${m.title} ${year}` : m.title;
            });

            console.log(`Syncing ${movieList.length} movies: ${movieList.join(', ')}`);

            // ── 2. Call Apify (wait up to 2 min for results) ─────────────────
            const apifyRes = await fetch(
              `https://api.apify.com/v2/acts/trovevault~movie-box-office-tracker/run-sync-get-dataset-items?token=${APIFY_TOKEN}&timeout=120`,
              {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ movies: movieList }),
              }
            );
            if (!apifyRes.ok) {
              const txt = await apifyRes.text();
              core.setFailed(`Apify ${apifyRes.status}: ${txt}`);
              return;
            }
            const results = await apifyRes.json();
            console.log(`Apify returned ${results.length} rows`);

            // ── 3. Patch domesticGross in Firestore ───────────────────────────
            let updated = 0;
            for (const row of results) {
              if (!row.domesticGross) continue;
              const gross = typeof row.domesticGross === 'number'
                ? row.domesticGross
                : parseInt(String(row.domesticGross).replace(/[^0-9]/g, ''));
              if (!gross || gross <= 0) continue;

              const rowTitle = (row.title || '').toLowerCase();
              const match = movies.find(m => {
                const t = m.title.toLowerCase();
                return t === rowTitle || t.includes(rowTitle) || rowTitle.includes(t);
              });
              if (!match) { console.warn(`No Firestore match for BOM title: "${row.title}"`); continue; }

              const patchUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/movies/${match.id}?updateMask.fieldPaths=domesticGross&key=${FIREBASE_KEY}`;
              await fetch(patchUrl, {
                method:  'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ fields: { domesticGross: { integerValue: String(gross) } } }),
              });
              updated++;
              console.log(`✓ ${match.title}: $${gross.toLocaleString()}`);
            }

            console.log(`\nDone — updated ${updated} / ${movies.length} movies.`);
