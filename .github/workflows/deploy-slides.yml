name: Deploy Slides Hosting

# Manual only, matching the Cloud Functions workflow in mcrae-submit: a deploy
# should be a decision, not a side effect of merging.
#
# This publishes assets/slides to the mcraesocial-slides Firebase Hosting site,
# using the headers in firebase.json. The slides are committed to this repo in
# full (11,917 files), so the checkout is the complete site.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm publishing assets/slides'
        required: true
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Input must be exactly 'deploy'. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

      # Shallow: the slide history is ~3 GB and none of it is needed to deploy.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The guard that makes this safe to hand a button to. `firebase deploy`
      # publishes whatever is in assets/slides and DELETES anything absent from
      # it, so a truncated or failed checkout would wipe the live slides. Refuse
      # to deploy unless the tree looks like the real thing.
      - name: Verify the slide tree is intact
        run: |
          COUNT=$(find assets/slides -type f | wc -l)
          DECKS=$(find assets/slides -name index.html | wc -l)
          SIZE=$(du -sm assets/slides | cut -f1)
          echo "files=$COUNT decks=$DECKS size=${SIZE}MB"
          if [ "$COUNT" -lt 10000 ] || [ "$DECKS" -lt 30 ] || [ "$SIZE" -lt 3000 ]; then
            echo "::error::Slide tree looks incomplete (expected ~11900 files, ~35 decks, ~3800MB). Refusing to deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g firebase-tools

      - name: Write service account credential
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          if [ ! -s "$RUNNER_TEMP/sa.json" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty or not set."
            exit 1
          fi

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy \
            --only hosting:mcraesocial-slides \
            --project project-7910201586224417193 \
            --non-interactive

      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

      - name: Confirm cache headers went live
        run: |
          sleep 15
          URL="https://mcraesocial-slides.web.app/social-30/democracy/democracy/assets/669B637B-33B5-464E-B1F4-B6785DECB81A/669B637B-33B5-464E-B1F4-B6785DECB81A.json"
          echo "Cache-Control now:"
          curl -sI "$URL" | grep -i cache-control || echo "  (could not read header)"
